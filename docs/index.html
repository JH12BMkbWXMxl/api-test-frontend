    function changelogState(string)
    {
        const today = new Date();
        $('#logConnection').html(today + ' -- '+ string)
    }

    async function getPing()
    {
        
      
        parametrs = {
          actionApi : 'ping'
        };
        data = JSON.stringify(parametrs)

        timeStart = Date.now()

        //  

        try {
          // 3. Отправляем данные и ждем ответ

          const response = await centrifuge.rpc('data', data);
          // const response = await centrifuge.rpc('data', JSON.stringify(parametrs));
        
          timeStop = Date.now()

          ms = timeStop - timeStart
          changelogState(' ping > '+ timeStart + ' | >'+ timeStop + ' | > '+ ms + ': ms')
        } catch (err) {
          console.error('Ошибка при отправке RPC:', err);


        }

        setTimeout('getPing()', 5000)
    }

    const container = document.getElementById('counter');

    const isLocal = 
      
      location.hostname === 'localhost' || 
      location.hostname === '127.0.0.1' || 
      location.hostname === '[::1]' || 
      location.protocol === 'file:';

    if (isLocal) {
        wsData = 'ws://localhost/connection/websocket';
        httData = '/http/centrifugo/connection_token'
    } else {

        wsData = "wss://"+ getIP() +"/connection/websocket"
        httData = 'https://'+ getIP() +'/http'
    }

    const centrifuge = new Centrifuge(wsData, {
    // Вызывается при подключении и автоматически перед истечением exp токена
      getToken: async () => {
       // const res = await fetch("/http/centrifugo/connection_token");
       // const data = await res.json();

        changelogState(' > /http/centrifugo/connection_token')

        const url = httData;
  
        const payload = {
          'littleTroll': littleTroll(),
          'actionApi' : 'connectionToken'
        };

        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
              // Add Authorization headers here if needed
            },
            body: JSON.stringify(payload)
          });

          // Check if the server returned a 200-299 status code
          if (!response.ok) {
            changelogState(' > /http/centrifugo/connection_token ->  error ->'+ response.status)
            throw new Error(`HTTP error! Status: ${response.status}`);
          }

          

          const data = await response.json();

          dataM = data.message

          changelogState(' > /http/centrifugo/connection_token ->  token ->'+ dataM.token)

          dataM
          return dataM.token;
          
        } catch (error) {
          console.error('Error sending POST request:', error);
        }


      },
      // Minimum delay between reconnect attempts in milliseconds (default: 500)
     // minReconnectDelay: 500,
      // Maximum delay between reconnect attempts in milliseconds (default: 20000)
      maxReconnectDelay: 10000,
      timeout: 15000 
    });
    

    centrifuge.on('connecting', function (ctx) {
      changelogState(`socket connecting: ${ctx.code}, ${ctx.reason}`)
      console.log(`connecting: ${ctx.code}, ${ctx.reason}`);
    }).on('connected', function (ctx) {
      changelogState(`connected over ${ctx.transport}`)
      
      getPing()

      console.log(`connected over ${ctx.transport}`);

      getPatternList();

    }).on('disconnected', function (ctx) {
      changelogState(`disconnected: ${ctx.code}, ${ctx.reason}`)


      console.log(`disconnected: ${ctx.code}, ${ctx.reason}`);
    }).connect();


    const sub = centrifuge.newSubscription("channel");

    sub.on('publication', function (ctx) {
      container.innerHTML = ctx.data.value;
      document.title = ctx.data.value;
    }).on('subscribing', function (ctx) {
      console.log(`subscribing: ${ctx.code}, ${ctx.reason}`);
    }).on('subscribed', function (ctx) {
      console.log('subscribed', ctx);
    }).on('unsubscribed', function (ctx) {
      console.log(`unsubscribed: ${ctx.code}, ${ctx.reason}`);
    }).subscribe();


    async function sendText(parametrs = '') {

      data = $("#sendTextarea")[0].value

      if (parametrs != '') {
        data = JSON.stringify(parametrs)
      }


      data = JSON.parse(data);

      data.idempotency_key = '123455'

      data = JSON.stringify(data)

      data

      try {
        // 3. Отправляем данные и ждем ответ

        const response = await centrifuge.rpc('data', data);
        // const response = await centrifuge.rpc('data', JSON.stringify(parametrs));

        message = response.data.message

        if (message.length === 0) {
          return
        }

        if (parametrs.actionApi == 'testerAPI/savePattern') {
          getListPatterns(response)
          $("#receivedTextArea").val(JSON.stringify(response));
        } else if (parametrs.actionApi == 'testerAPI/getPatterns') {
          getListPatterns(response)
          $("#receivedTextArea").val(JSON.stringify(response));
        } else {
          $("#receivedTextArea").val(JSON.stringify(response));
        }


        console.log('Ответ от сервера:', response);
      } catch (err) {
        console.error('Ошибка при отправке RPC:', err);

        sendText()
      }
    }

    $(document).ready(function () {
      // Добавление нового поля
      $('#add-field').click(function () {
        var newField = '<div class="field-row"><input type="text" name="parametr" placeholder="parametr">|<textarea type="text" name="valuem" placeholder="value">'+
          '<br></textarea> <button type="button" class="remove-field">Удалить</button></div>';
        $('#fields-container').append(newField);
      });

      $('#save-endpoint').click(function () {

        nameEndPoint = $('#endpoint-save-name')[0]
        if (nameEndPoint.value == '') {
          alert('empty name endpoint');
          return
        }

        apiConfig = $('#api-config')[0].innerHTML

        apiPattern = getApiPattern()

        parametrs = {
          'actionApi': 'testerAPI/savePattern',
          'patternTitle': nameEndPoint.value,
          'patternText': JSON.stringify(apiPattern),
          'password': $("#testerKeyCode").val(),
        }

        sendText(parametrs)

      });

      $('#set-query').click(function () {
        list = {}

        $('.field-row').each(function (index, element) {

          parametrEl = element.querySelector('[name="parametr"]')
          valueEl = element.querySelector('[name="valuem"]');

          list[parametrEl.value] = valueEl.value
        });

        list['actionApi'] = $("#endpoint-name-value")[0].value
        $("#sendTextarea").val(JSON.stringify(list));
      });

      // Удаление поля (используем делегирование событий, так как кнопка создана динамически)
      $('#fields-container').on('click', '.remove-field', function () {
        $(this).parent('.field-row').remove();
      });
    });
  </script>
